version: "3.8"

services:
  ecommerce-backend:
    container_name: ecommerce-backend
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./src:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - ecommerce-database
    environment:
      DATABASE_URL: postgres://postgres:admin@ecommerce-database:5432/ecommerce
    networks:
      - ecommerce-network

  ecommerce-database:
    container_name: ecommerce-database
    image: postgres:latest
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    networks:
      - ecommerce-network

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ecommerce.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - ecommerce-database
    networks:
      - ecommerce-network

volumes:
  postgres_data:

networks:
  ecommerce-network:
    driver: bridge
